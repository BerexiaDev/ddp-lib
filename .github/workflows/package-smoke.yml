name: Package smoke tests

on:
  push:
    branches:
      - main
      - fix/package-runtime-contract # for testing the latest ddp-lib release

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: python -m pip install build twine

      - run: python scripts/smoke_install.py